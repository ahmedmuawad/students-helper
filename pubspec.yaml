name: students_helper
description: تطبيق مساعد الطالب - تنظيم الجدول الدراسي والدروس والمهام والامتحانات مع آلة حاسبة علمية متقدمة.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  fl_chart: ^0.68.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  path_provider: ^2.1.6
  printing: ^5.15.0
  pdfrx: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
