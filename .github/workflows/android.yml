name: بناء تطبيق أندرويد

# البناء بيحصل هنا مش على جهاز حد — الـAPK بينزل من صفحة التشغيل.
on:
  push:
    branches: [claude/flutter-student-management-app-8bhzc6, main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: عنوان السيرفر اللي التطبيق هيتكلم معاه
        default: https://student-helper.stop4web.online
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: الحزم
        run: flutter pub get

      - name: التحليل الساكن
        run: flutter analyze

      - name: الاختبارات
        run: flutter test

      # ملف Firebase مش في المستودع (بيتحط كسر في إعدادات المستودع).
      # لو مش موجود، البناء بيكمل والتطبيق بيشتغل من غير تسجيل دخول.
      - name: إعدادات Firebase لو متاحة
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✓ google-services.json اتحط — تسجيل الدخول هيشتغل"
          else
            echo "⚠ مفيش google-services.json — النسخة دي من غير تسجيل دخول"
          fi

      - name: بناء APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://student-helper.stop4web.online' }}

      - name: رفع الـAPK
        uses: actions/upload-artifact@v4
        with:
          name: students-helper-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
